name: CI

on:
  pull_request:
  push:
    branches: [main, FlashReserve]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run --workspace=@flashreserve/shared-types build

      - name: Test Frontend
        run: npm run --workspace=@flashreserve/frontend test

      - name: Build Frontend
        run: npm run --workspace=@flashreserve/frontend build

      - name: Test Backend
        run: npm run --workspace=@flashreserve/backend test

      - name: Build Backend
        run: npm run --workspace=@flashreserve/backend build
